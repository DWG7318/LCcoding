[package]
name = "lccoding"
version = "2.5.1"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "lccoding"
path = "src/lib.rs"

[[bin]]
name = "lccoding-bi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
gix = { version = "=0.86.0", default-features = false, features = ["sha1"] }
futures-util = "=0.3.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6", "compression", "wry"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
