name: Validate LCCoding
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python lc-coding/scripts/validate_repository.py .
      - run: python lc-coding/tests/run_tests.py
