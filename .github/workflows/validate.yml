name: Validate LCCoding
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python lc-coding/scripts/validate_repository.py .
      - run: python lc-coding/tests/run_tests.py

  validate-windows-path-roundtrip:
    name: Validate standard-user PATH roundtrip
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Select Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify exact clean repair identity
        shell: pwsh
        env:
          EXPECTED_HOOKS_SHA256: e25a7bd12d9921444d8fe51578a3fa67f48d67e5175a57bb5303b01c297f4a47
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_ACTIONS -ne "true") { throw "TASK22_WIN_CI_NOT_GITHUB_ACTIONS" }
          if ($env:GITHUB_REPOSITORY -ne "DWG7318/LCcoding") { throw "TASK22_WIN_CI_REPOSITORY_INVALID" }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "TASK22_WIN_CI_CHECKOUT_INVALID" }
          if (git status --porcelain=v1) { throw "TASK22_WIN_CI_CHECKOUT_DIRTY" }
          $hooks = "lc-coding/bi/src-tauri/windows/hooks.nsh"
          $hooksSha256 = (Get-FileHash -LiteralPath $hooks -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hooksSha256 -ne $env:EXPECTED_HOOKS_SHA256) { throw "TASK22_WIN_CI_HOOKS_IDENTITY_INVALID" }

      - name: Build exact GitHub Actions candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $outputRoot = Join-Path $env:RUNNER_TEMP "lccoding-task22-win-ci-package"
          if (Test-Path -LiteralPath $outputRoot) { throw "TASK22_WIN_CI_PACKAGE_ROOT_PREEXISTS" }
          & lc-coding/bi/scripts/package-release.ps1 -OutputRoot $outputRoot
          $provenance = Get-Content -LiteralPath (Join-Path $outputRoot "release/provenance.json") -Raw | ConvertFrom-Json
          if ($provenance.commit -ne $env:GITHUB_SHA -or $provenance.build_mode -ne "FORMAL_GITHUB_ACTIONS") {
            throw "TASK22_WIN_CI_PACKAGE_PROVENANCE_INVALID"
          }

      - name: Run reusable standard-user smoke parent
        shell: powershell
        env:
          EXPECTED_HOOKS_SHA256: e25a7bd12d9921444d8fe51578a3fa67f48d67e5175a57bb5303b01c297f4a47
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $parent = Join-Path $env:GITHUB_WORKSPACE "lc-coding/bi/tests/packaging/run-standard-user-install-smoke.ps1"
          & $parent `
            -SourceRepository $env:GITHUB_WORKSPACE `
            -PackageDirectory (Join-Path $env:RUNNER_TEMP "lccoding-task22-win-ci-package/release") `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "lccoding-task22-win-ci-evidence") `
            -ExpectedCommit $env:GITHUB_SHA `
            -ExpectedHooksSha256 $env:EXPECTED_HOOKS_SHA256
          if ($LASTEXITCODE -ne 0) { throw "TASK22_WIN_CI_PARENT_FAILED" }

      - name: Upload Task22 Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task22-win-ci-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\lccoding-task22-win-ci-evidence\orchestrator-result.json
            ${{ runner.temp }}\lccoding-task22-win-ci-evidence\result.json
            ${{ runner.temp }}\lccoding-task22-win-ci-package\release\installer.sha256
            ${{ runner.temp }}\lccoding-task22-win-ci-package\release\provenance.json
          if-no-files-found: warn
          compression-level: 0
